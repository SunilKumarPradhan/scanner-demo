<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Demo Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>

        <form id="loginForm" action="https://api.example.com/login" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    Remember me
                </label>
            </div>

            <button type="submit">Login</button>
        </form>

        <div id="loginError" class="error-message"></div>

        <div class="links">
            <a href="forgot-password.html">Forgot Password?</a>
            <a href="register.html">Create Account</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            var rememberMe = document.getElementById('rememberMe').checked;

            // SECURITY: Removed storage of sensitive data
            // if (rememberMe) {
            //     localStorage.setItem('username', username);
            //     localStorage.setItem('password', password);
            // }

            var payload = {
                username: username,
                password: password
            };

            // SECURITY: Changed to POST request with JSON payload and HTTPS
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://api.example.com/auth', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(payload));

            xhr.onload = function() {
                if (xhr.status == 200) {
                    // SECURITY: Validate response data
                    try {
                        var response = JSON.parse(xhr.responseText);
                        if (response.token) {
                            document.cookie = "auth_token=" + response.token;

                            window.location.href = 'dashboard.html';
                        } else {
                            document.getElementById('loginError').innerHTML = 'Invalid response';
                        }
                    } catch (e) {
                        document.getElementById('loginError').innerHTML = 'Error parsing response';
                    }
                } else {
                    document.getElementById('loginError').innerHTML = 'Error: ' + xhr.statusText;
                }
            };

            xhr.onerror = function() {
                document.getElementById('loginError').innerHTML = 'Error: Request failed';
            };
        });

        // SECURITY: Removed debug logs
        // console.log('Debug mode enabled');
        // console.log('Server: ' + window.location.hostname);

        function checkAdmin() {
            // SECURITY: Validate stored data
            var isAdmin = localStorage.getItem('isAdmin') === 'true';
            if (isAdmin) {
                document.body.innerHTML += '<a href="/admin">Admin Panel</a>';
            }
        }
        checkAdmin();
    </script>
</body>
</html>
